[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sports-hedge"
version = "0.1.0"
description = "Paper-only football arbitrage research engine"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "cryptography>=44,<47",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
  "openpyxl>=3.1,<4",
  "scipy>=1.13,<2",
  # Windows CPython ships no IANA time-zone database; zoneinfo needs tzdata.
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sports_hedge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
  "live_logical: real-provider logical acceptance; skipped unless SPORTS_HEDGE_LIVE_LOGICAL=1",
  "owner_live_census: owner-live/read-only UNIVERSE mapping census; skipped unless SPORTS_HEDGE_OWNER_LIVE_CENSUS=1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
